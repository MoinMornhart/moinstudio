<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0f"/>
      <stop offset="1" stop-color="#1c1c24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#ff7a1a"/>
    </linearGradient>
    <pattern id="px" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#px)"/>
  <!-- Yin-Yang-Block-Logo -->
  <g transform="translate(96,64)">
    <rect x="0" y="0" width="192" height="192" rx="12" fill="#f4f4f4"/>
    <rect x="96" y="0" width="96" height="192" fill="#111"/>
    <rect x="0" y="96" width="96" height="96" fill="#111"/>
    <rect x="96" y="96" width="96" height="96" fill="#f4f4f4"/>
    <rect x="32" y="32" width="32" height="32" fill="#111"/>
    <rect x="128" y="128" width="32" height="32" fill="#111"/>
    <rect x="128" y="32" width="32" height="32" fill="#f4f4f4"/>
    <rect x="32" y="128" width="32" height="32" fill="#f4f4f4"/>
    <rect x="0" y="0" width="192" height="192" rx="12" fill="none" stroke="url(#accent)" stroke-width="6"/>
  </g>
  <text x="352" y="170" font-family="Segoe UI, Arial Black, sans-serif" font-size="96" font-weight="900" fill="#ffffff">Moin<tspan fill="url(#accent)">Studio</tspan></text>
  <text x="356" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="30" fill="#b9b9c6">Thumbnails · Schnitt · Planung – lokal, mit deinem Claude-Abo</text>
</svg>
