# Windows-Installer und Update-Veröffentlichung für MoinStudio.
# electron-builder bleibt auf 26.x gepinnt: v28 lehnt Updates unsignierter Apps voraussichtlich ab
# (siehe docs/research/tech.md, Abschnitt 1.5).
appId: de.moinmornhart.moinstudio
productName: MoinStudio
copyright: Copyright © 2026 Philip (MoinMornhart)

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json
  - '!**/*.map'

extraResources:
  - from: config
    to: config
  - from: blender
    to: blender
    filter:
      - '**/*.py'
  - from: resources/minecraft
    to: minecraft

asar: true

win:
  target:
    - target: nsis
      arch: x64
  icon: build/icon.ico
  # Unsigniert: kein publisherName, damit electron-updater die Signaturprüfung überspringt
  # (SHA-512-Prüfung der Downloads bleibt aktiv).

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: MoinStudio
  uninstallDisplayName: MoinStudio
  artifactName: MoinStudio-Setup-${version}.${ext}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  deleteAppDataOnUninstall: false

publish:
  provider: github
  owner: MoinMornhart
  repo: moinstudio
  # Der Workflow legt das Release vorher als Entwurf an und veröffentlicht es danach selbst.
  # Legt electron-builder es an, erzeugen parallele Uploads doppelte Releases.
  releaseType: draft
